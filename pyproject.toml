[project]
name = "vae-lesion-deficit"
version = "0.1.0"
description = "Lesion-deficit substrate recovery in voxel space (VLSM, SVR-LSM, and two-arm VAEs incl. a 3D-convolutional VAE), covariate-aware."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
    "nibabel>=5.0",
]

[project.optional-dependencies]
# Everything needed to open and run the tutorial notebooks.
notebook = [
    "jupyterlab>=4",
    "ipykernel>=6",
]

[tool.uv]
# The code is used from src/ (the notebooks do sys.path.insert(0, "src")); uv just manages the
# environment and dependencies rather than building/installing this repo as a package.
package = false
