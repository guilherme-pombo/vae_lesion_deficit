[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vae-lesion-deficit"
version = "0.1.0"
description = "Lesion-deficit substrate recovery in voxel space (VLSM, SVR-LSM, and two-arm VAEs incl. a 3D-convolutional VAE), covariate-aware."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "nibabel>=5.0",
]

[project.optional-dependencies]
# Everything needed to open and run the tutorial notebooks.
notebook = [
    "jupyterlab>=4",
    "ipykernel>=6",
]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# The vld package lives under src/ and is installed editable (`uv pip install -e .` / `pip install -e .`).
package = true
